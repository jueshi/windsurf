<!-- SEC Filing Section Navigation -->
<div class="sec-sections-nav">
    {% if sections %}
        <div class="mb-2">
            <small class="text-muted">Found {{ sections|length }} sections in {{ form_type }}</small>
        </div>
        <div class="list-group list-group-flush sec-sections-scroll">
            {% for section in sections %}
            <button class="list-group-item list-group-item-action py-2 px-3"
                    onclick="analyzeSection('{{ ticker }}', '{{ accession_number }}', '{{ section.id }}', '{{ cik }}', '{{ form_type }}')">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <span class="badge bg-primary me-2">{{ section.label }}</span>
                        <small>{{ section.description }}</small>
                    </div>
                    <i class="bi bi-robot text-info" title="AI Analysis"></i>
                </div>
            </button>
            {% endfor %}
        </div>
    {% else %}
        <p class="text-muted small p-3">No sections found in this filing.</p>
    {% endif %}
</div>
