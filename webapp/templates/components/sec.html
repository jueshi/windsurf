<div class="row">
    <div class="col-md-4">
        <h5 class="mb-3">SEC Filings for {{ ticker }}</h5>
        {% if filings %}
            <div class="list-group">
                {% for filing in filings %}
                <button class="list-group-item list-group-item-action"
                        hx-post="/sec/extract/{{ ticker }}/{{ filing.accessionNumber }}?cik={{ filing.cik }}"
                        hx-target="#sec-tables-content"
                        hx-indicator="#sec-spinner">
                    <div class="d-flex w-100 justify-content-between">
                        <h6 class="mb-1">{{ filing.form }}</h6>
                        <small>{{ filing.filingDate }}</small>
                    </div>
                    <small class="text-muted">{{ filing.accessionNumber }}</small>
                </button>
                {% endfor %}
            </div>
        {% else %}
            <p class="text-muted">No filings found or CIK lookup failed.</p>
        {% endif %}
    </div>
    <div class="col-md-8">
        <h5>Extracted Tables</h5>
        <div id="sec-spinner" class="htmx-indicator spinner-border spinner-border-sm text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>

        <div id="sec-tables-content" class="border p-3 bg-white rounded" style="max-height: 600px; overflow-y: auto;">
            <p class="text-muted small">Select a filing to extract tables.</p>
        </div>
    </div>
</div>
