<div class="list-group">
    {% for ticker in tickers %}
    <button type="button" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
            onclick="loadTicker('{{ ticker.symbol }}')">
        {{ ticker.symbol }}
        <span class="badge bg-danger rounded-pill pointer"
              hx-delete="/tickers/{{ ticker.id }}"
              hx-target="#current-ticker-list"
              hx-confirm="Remove {{ ticker.symbol }}?">×</span>
    </button>
    {% else %}
    <div class="p-3 text-center text-muted">No tickers in this list.</div>
    {% endfor %}
</div>

<div class="p-2 border-top">
    <form hx-post="/tickers/add/{{ list_id }}" hx-target="#current-ticker-list" class="input-group input-group-sm">
        <input type="text" name="symbol" class="form-control" placeholder="Add Ticker (e.g. AAPL)">
        <button class="btn btn-primary" type="submit">Add</button>
    </form>
</div>

<script>
    // Update badge count
    document.getElementById('ticker-count').textContent = '{{ tickers|length }}';

    function loadTicker(symbol) {
        // Load chart
        if (typeof window.loadTicker === 'function') {
            window.loadTicker(symbol);
        }

        // Load Fundamental tab
        htmx.ajax('GET', `/analysis/fundamental/${symbol}`, '#fundamental-container');

        // Load News tab
        htmx.ajax('GET', `/news/feed/${symbol}`, '#news-container');

        // Load SEC tab
        htmx.ajax('GET', `/sec/filings/${symbol}`, '#sec-container');
    }
</script>
