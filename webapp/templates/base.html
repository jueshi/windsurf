<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Stock Toolbox Web{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; }
        .sidebar { 
            height: 100vh; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 160px;
            padding-top: 1rem; 
            overflow-y: auto; 
            background-color: #343a40; 
            color: white; 
            z-index: 100;
        }
        .main-content { 
            margin-left: 160px; 
            padding: 15px; 
            width: calc(100% - 160px);
        }
        .sidebar a { color: #ced4da; text-decoration: none; display: block; padding: 10px 15px; }
        .sidebar a:hover { background-color: #495057; color: white; }
        .sidebar .active { background-color: #0d6efd; color: white; }
        /* Sidebar ticker list items */
        .ticker-list-item { cursor: pointer; padding: 5px; border-bottom: 1px solid #495057; }
        .ticker-list-item:hover { background-color: #495057; }
        .ticker-list-item.selected { background-color: #0d6efd; }
        
        /* Main panel ticker items */
        .ticker-item { transition: background-color 0.15s; }
        .ticker-item:hover { background-color: #e9ecef; }
        .ticker-item.active { background-color: #0d6efd; color: white; }
        .ticker-item.active .text-danger { color: white !important; }
        .ticker-item .ticker-checkbox { accent-color: #0d6efd; }
        
        /* Markdown content styling */
        .markdown-content { font-size: 0.9rem; line-height: 1.6; }
        .markdown-content h1, .markdown-content h2, .markdown-content h3, 
        .markdown-content h4, .markdown-content h5, .markdown-content h6 { 
            margin-top: 1rem; margin-bottom: 0.5rem; font-weight: 600; 
        }
        .markdown-content h1 { font-size: 1.4rem; border-bottom: 1px solid #dee2e6; padding-bottom: 0.3rem; }
        .markdown-content h2 { font-size: 1.2rem; color: #0d6efd; }
        .markdown-content h3 { font-size: 1.1rem; }
        .markdown-content p { margin-bottom: 0.5rem; }
        .markdown-content ul, .markdown-content ol { margin-bottom: 0.5rem; padding-left: 1.5rem; }
        .markdown-content li { margin-bottom: 0.25rem; }
        .markdown-content table { 
            width: 100%; border-collapse: collapse; margin: 0.5rem 0; 
            font-size: 0.85rem; background: white; 
        }
        .markdown-content th, .markdown-content td { 
            border: 1px solid #dee2e6; padding: 0.4rem 0.6rem; text-align: left; 
        }
        .markdown-content th { background-color: #f8f9fa; font-weight: 600; }
        .markdown-content tr:nth-child(even) { background-color: #f8f9fa; }
        .markdown-content strong { color: #212529; }
        .markdown-content code { background: #e9ecef; padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.85em; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar d-none d-md-block">
        <h4 class="text-center mb-4">Stock Toolbox</h4>

        <div class="mb-3 px-3">
            <input type="text" class="form-control form-control-sm" name="q" placeholder="Search Tickers..."
                   hx-get="/tickers/search" hx-trigger="keyup changed delay:500ms" hx-target="#ticker-results">
            <div id="ticker-results" class="list-group position-absolute mt-1 shadow-sm" style="z-index: 1000; width: 90%;"></div>
        </div>

        <div class="px-3 mb-2">
            <small class="text-muted text-uppercase">Ticker Lists</small>
            <div id="ticker-lists-container" hx-get="/tickers/list" hx-trigger="load">
                <!-- Loaded via HTMX -->
                <div class="spinner-border spinner-border-sm text-light" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
