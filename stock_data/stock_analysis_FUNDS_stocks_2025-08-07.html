
            <!DOCTYPE html>
            <html lang="en">
            <head>
                <meta charset="UTF-8">
                <title>Stock Price Analysis Report</title>
                <style>
                    body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
                    h1 { color: #333; text-align: center; }
                    .plot-container { 
                        display: flex; 
                        flex-wrap: wrap; 
                        justify-content: center; 
                        gap: 20px; 
                        margin-top: 20px; 
                    }
                    .plot-item { 
                        text-align: center; 
                        max-width: 100%; 
                    }
                    .plot-item img { 
                        max-width: 100%; 
                        height: auto; 
                        border: 1px solid #ddd; 
                        border-radius: 5px; 
                    }
                </style>
            </head>
            <body>
                <h1>Stock Price Analysis Report</h1>
                <div class="plot-container">
            
                    <div class="plot-item">
                        <h2>GOOG Stock Prices</h2>
                        <img src="GOOG_daily_weekly_monthly.png" alt="GOOG Stock Price Plot">
                    </div>
                
                    <div class="plot-item">
                        <h2>AAPL Stock Prices</h2>
                        <img src="AAPL_daily_weekly_monthly.png" alt="AAPL Stock Price Plot">
                    </div>
                
                    <div class="plot-item">
                        <h2>META Stock Prices</h2>
                        <img src="META_daily_weekly_monthly.png" alt="META Stock Price Plot">
                    </div>
                
                    <div class="plot-item">
                        <h2>MSFT Stock Prices</h2>
                        <img src="MSFT_daily_weekly_monthly.png" alt="MSFT Stock Price Plot">
                    </div>
                
                    <div class="plot-item">
                        <h2>AMZN Stock Prices</h2>
                        <img src="AMZN_daily_weekly_monthly.png" alt="AMZN Stock Price Plot">
                    </div>
                
                    <div class="plot-item">
                        <h2>NVDA Stock Prices</h2>
                        <img src="NVDA_daily_weekly_monthly.png" alt="NVDA Stock Price Plot">
                    </div>
                
                    <div class="plot-item">
                        <h2>TSLA Stock Prices</h2>
                        <img src="TSLA_daily_weekly_monthly.png" alt="TSLA Stock Price Plot">
                    </div>
                
                    <div class="plot-item">
                        <h2>BRK-B Stock Prices</h2>
                        <img src="BRK-B_daily_weekly_monthly.png" alt="BRK-B Stock Price Plot">
                    </div>
                
                </div>
            </body>
            </html>
